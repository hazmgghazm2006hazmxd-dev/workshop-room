<style>

:root[data-theme="dark"]{

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:980px;margin:0 auto}
h1,h2,h3{font-family:var(--f-head);font-weight:600;line-height:1.35;margin:0;text-wrap:balance}

p{margin:0 0 .6em} a{color:var(--brand)}

:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}

.top{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;padding:28px 0 18px}
.eyebrow{font-size:.8rem;letter-spacing:.04em;color:var(--muted);margin:0 0 6px}
.sub{color:var(--muted);margin:6px 0 0;font-size:.95rem}

.deadline b{font-family:var(--f-head);font-size:1.6rem;color:var(--signal);font-variant-numeric:tabular-nums}
.deadline span{font-size:.85rem;color:var(--muted)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);padding:6px 0 0;margin-bottom:20px}
nav.tabs a{padding:10px 16px;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap;border-bottom:3px solid transparent}

table{border-collapse:collapse;width:100%;min-width:520px;font-size:.93rem}

.btn{font:inherit;font-weight:500;cursor:pointer;border-radius:8px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);padding:8px 18px;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--brand)} .btn.danger{border-color:var(--warn);color:var(--warn);background:transparent}
.btn.sel{background:var(--brand);color:var(--brand-ink)} .btn.small{padding:4px 12px;font-size:.88rem}

.role-card{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:8px;min-width:0}
.role-card h3{display:flex;gap:8px;align-items:center}
.role-card .en{color:var(--muted);font-size:.85rem}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c,var(--brand));border-radius:99px}
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task input{width:20px;height:20px;margin-top:5px;accent-color:var(--brand);flex:none}
.task.done label,.task.done .tx{color:var(--muted);text-decoration:line-through}
.task label,.task .tx{flex:1;cursor:pointer;min-width:0} .task .tx{cursor:default}
.task .when{flex:none;font-size:.75rem;color:var(--muted);white-space:nowrap}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-weight:500;font-size:.92rem}
input[type=text],input[type=url],input[type=date],textarea{font:inherit;width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:9px 12px}
textarea{min-height:110px;resize:vertical}
.hint{font-size:.82rem;color:var(--muted);margin:0}
.msg{padding:8px 12px;border-radius:8px;font-size:.9rem;margin:8px 0;background:var(--surface2)}
.msg.err{color:var(--warn)} .msg.ok{color:var(--good)}
.banner{border:1px dashed var(--line);border-radius:12px;padding:16px;background:var(--surface);margin-bottom:16px}
.stars{display:flex;gap:2px;direction:ltr;justify-content:flex-end;width:max-content}
.stars button{background:none;border:0;font-size:1.8rem;line-height:1;color:var(--line);cursor:pointer;padding:2px 4px}
.stars button.on{color:var(--signal)} .stars.ro button{cursor:default;font-size:1.1rem;padding:0 1px}
.fb{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--bg)}
.fb.warn{border-color:var(--warn)}
.fb p{margin:6px 0 0;white-space:pre-wrap}
.rtext{white-space:pre-wrap;max-height:320px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:.92rem;margin-top:8px}
details{margin-bottom:6px} details summary{cursor:pointer;font-weight:500}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)} .small{font-size:.85rem}
.tl{display:grid;gap:0}
.tl>div{display:grid;grid-template-columns:170px minmax(0,1fr);gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.tl>div:last-child{border-bottom:0} .tl b{font-weight:500;color:var(--brand)}
@media(max-width:560px){.tl>div{grid-template-columns:1fr;gap:0}}
@media(prefers-reduced-motion:no-preference){.bar>i{transition:width .3s}}
</style>

function buildSummary(){
  var L=['تقرير متابعة الفريق (من سجل غرفة العمل، التواريخ كما سُجّلت)',''];
  ROLES.forEach(function(r){
    var u=holder(r.id),m=u?S.members[u]:null;if(!m)return;
    var p=prog(m);
    L.push(r.ar+' ('+r.en+') - '+m.name);
    L.push('المهام: '+p.n+' من '+p.t+' | المخرجات: '+delivCount(u,r)+' من '+r.slots.length+(S.reports[u]?' | كلمات التقرير: '+repWords(S.reports[u]):''));
    var l=fbList(u).slice().reverse();
    if(!l.length)L.push('  لا توجد ملاحظات مسجلة');
    l.forEach(function(e){L.push('  - '+fmt(e.createdAt)+' | '+(KINDS[e.kind]||'ملاحظة')+(e.stars?' | '+e.stars+' من 5':'')+' | '+e.text+((m.acks&&m.acks[e.id])?' | اطّلع: '+fmt(m.acks[e.id]):' | لم يطّلع بعد'));});
    L.push('');
  });
  return L.join('\n');
}

  if(!S.owner)return '<p class="muted">جارٍ التحميل…</p>';
  var rows=ROLES.map(function(r){

    if(!m)return '<tr><td>'+chipRole(r)+'</td><td colspan="6" class="muted">شاغر</td></tr>';
    var p=prog(m),l=fbList(u),warns=l.filter(function(e){return e.kind==='warn';}).length,last=l.filter(function(e){return e.stars;})[0];
    return '<tr><td>'+chipRole(r)+'</td><td>'+esc(m.name)+'</td><td style="font-variant-numeric:tabular-nums">'+p.n+'/'+p.t+'</td><td style="font-variant-numeric:tabular-nums">'+delivCount(u,r)+'/'+r.slots.length+'</td><td style="font-variant-numeric:tabular-nums">'+(u===S.uid?'-':repWords(S.reports[u]))+'</td><td>'+(u===S.uid?'-':(warns?'<span class="chip warn">'+warns+' تنبيه</span> ':'')+(last?last.stars+' ★':(l.length?l.length+' ملاحظة':'لا شيء')))+'</td><td><a href="#section-'+r.id+'">فتح</a></td></tr>';
  }).join('');
  var sum=buildSummary();
  var dl=S.settings.deadline||DEFAULT_DEADLINE;
  return stateBanner()+'<section class="panel"><h2>لوحة القائد</h2><p>نظرة على الفريق كله. لتقييم عضو أو تنبيهه افتح قسمه من الجدول، وهناك تضيف النجوم وتعليقك.</p>'+
  '<div class="tbl"><table><thead><tr><th>الدور</th><th>العضو</th><th>المهام</th><th>المخرجات</th><th>كلمات التقرير</th><th>المتابعة</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></section>'+
  '<section class="panel"><h2>موعد التسليم</h2><div class="row"><input type="date" id="dlIn" data-draft="deadline" value="'+esc(dv('deadline',dl))+'" style="max-width:220px"><button class="btn" data-act="saveDeadline">حفظ الموعد</button></div>'+msgHtml('dl')+'</section>'+
  '<section class="panel"><h2>ملخص المتابعة للدكتورة</h2><p class="small muted">يتولّد تلقائياً من السجل بتواريخه، وتستطيع لصقه في تقريرك (النشاط 3) كدليل على متابعتك للفريق.</p>'+
  '<textarea id="sumTxt" readonly dir="auto" style="min-height:220px">'+esc(sum)+'</textarea>'+msgHtml('sum')+'<div style="margin-top:10px"><button class="btn" data-act="copySum">نسخ الملخص</button></div></section>';
}

function render(){
  S.pending=false;
  var v;
  if(S.view.indexOf('section-')===0)v=viewSection(S.view.slice(8));
  else v=({overview:viewOverview,'my-role':viewRole,team:viewTeam,'leader-board':viewLeader}[S.view]||viewOverview)();
  $app.innerHTML='<div class="wrap">'+head()+nav()+whoBar()+v+'</div>';
}
function typing(){var a=document.activeElement;return !!(a&&$app.contains(a)&&(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&(a.type==='text'||a.type==='url'||a.type==='date'))));}
function renderSafe(){if(typing())S.pending=true;else render();}
function route(){
  var h=(location.hash||'').slice(1);
  var ok=['overview','my-role','team','leader-board'].indexOf(h)>-1||(h.indexOf('section-')===0&&RBY[h.slice(8)]);
  S.view=ok?h:'overview';if(S.view==='leader-board'&&!S.owner&&S.ownerKnown)S.view='overview';S.confirm=null;render();window.scrollTo(0,0);
}

/* ---------- الإجراءات ---------- */
async function pickRole(id){
  var name=(dv('name',lsName())||'').trim();
  if(!name){flash('pick','اكتب اسمك أولاً','err');return;}
  var r=RBY[id];if(r.ownerOnly&&!S.owner){flash('pick','هذا الدور لقائد الفريق','err');return;}
  var t=takenBy(id);if(t&&t!==S.uid){flash('pick','هذا الدور محجوز لزميل آخر','err');return;}
  try{
    var okc=await S.db.claim(id,S.uid);
    if(!okc){flash('pick','سبقك زميل إلى هذا الدور','err');return;}
    await enqueue('m',function(){return S.db.doc('members/'+S.uid).set({name:name,role:id,done:{},acks:{},joinedAt:Date.now(),updatedAt:Date.now()});});
    try{localStorage.setItem('ws-name',name);}catch(e){}
    flash('role','تم حفظ دورك');
  }catch(e){flash('pick','لم يُحفظ الدور ('+code(e)+')','err');}
}
function toggleTask(id,val){
  enqueue('m',function(){var o={};o[id]=val;return S.db.doc('members/'+S.uid).update({done:o,updatedAt:Date.now()});})
   .catch(function(e){flash('role','لم يُحفظ التغيير ('+code(e)+')','err');});
}
function freeRole(uid,roleId,key){
  Promise.all([S.db.doc('roles/'+roleId).delete(),S.db.doc('members/'+uid).delete()]).catch(function(e){flash(key,'تعذّر التنفيذ ('+code(e)+')','err');});
}
function ack(id){
  enqueue('m',function(){var o={};o[id]=Date.now();return S.db.doc('members/'+S.uid).update({acks:o});}).catch(function(e){flash('role','تعذّر الحفظ ('+code(e)+')','err');});
}
function setSaveState(t){S.saveState=t;var e=document.getElementById('saveState');if(e)e.textContent=t;}
function reportDoc(extra){
  var b=S.myReport||{},secs=Object.assign({},b.sections||{});
  SECTIONS.forEach(function(s){secs[s.id]=dv('rs_'+s.id,secs[s.id]);});
  var doc=Object.assign({},b,{sections:secs,link:(dv('rLink',b.link)||'').trim(),note:dv('rNote',b.note),video:(dv('rVideo',b.video)||'').trim()},extra||{},{updatedAt:Date.now()});
  if((doc.link&&!safeUrl(doc.link))||(doc.video&&!safeUrl(doc.video)))return {err:'الرابط يجب أن يبدأ بـ https://'};
  var len=0;SECTIONS.forEach(function(s){len+=(secs[s.id]||'').length;});
  if(len>200000)return {err:'النص طويل جداً، استخدم رابطاً أو ملف PDF'};
  if(!doc.submittedAt&&(doc.link||doc.fileId||len))doc.submittedAt=Date.now();
  return {doc:doc};
}
function saveReport(silent,extra){
  var x=reportDoc(extra);if(x.err){flash('report',x.err,'err');return Promise.resolve();}
  setSaveState('جارٍ الحفظ…');
  return enqueue('r',function(){return S.db.doc('reports/'+S.uid).set(x.doc);})
   .then(function(){setSaveState('تم الحفظ '+fmt(Date.now()));if(!silent)flash('report','تم حفظ مشروعك');})
   .catch(function(e){setSaveState('لم يُحفظ');flash('report','لم يُحفظ ('+code(e)+')','err');});
}
function scheduleSave(){setSaveState('تعديلات لم تُحفظ بعد…');clearTimeout(saveTimer);saveTimer=setTimeout(function(){saveReport(true);},2000);}
function saveSlot(sid,extra){
  var old=((S.deliv[S.uid]||{}).slots||{})[sid]||{};
  var cur=Object.assign({},old,{link:(dv('dl_'+sid+'_link',old.link)||'').trim(),text:dv('dl_'+sid+'_text',old.text)},extra||{},{updatedAt:Date.now()});
  if(cur.link&&!safeUrl(cur.link)){flash('dl_'+sid,'الرابط يجب أن يبدأ بـ https://','err');return Promise.resolve();}
  if((cur.text||'').length>40000){flash('dl_'+sid,'النص طويل جداً، استخدم رابطاً أو ملفاً','err');return Promise.resolve();}
  return enqueue('d',function(){var b=S.deliv[S.uid]||{},slots=Object.assign({},b.slots||{});slots[sid]=cur;return S.db.doc('deliverables/'+S.uid).set({slots:slots,updatedAt:Date.now()});})
   .then(function(){flash('dl_'+sid,'تم الحفظ، ويراه الفريق الآن');}).catch(function(e){flash('dl_'+sid,'لم يُحفظ ('+code(e)+')','err');});
}
function fileType(f){var n=f.name||'';return /\.pdf$/i.test(n)?'application/pdf':/\.md$/i.test(n)?'text/markdown':/\.txt$/i.test(n)?'text/plain':'';}
function uploadFor(f,key,after){
  if(!f)return;if(!S.assets){flash(key,'رفع الملفات غير متاح لحسابك، استخدم الرابط','err');return;}
  var t=fileType(f);if(!t){flash(key,'الصيغ المدعومة PDF أو TXT أو MD. حوّل ملف Word إلى PDF','err');return;}
  flash(key,'جارٍ رفع الملف…');
  S.assets.upload(f,{type:t}).then(function(r){return after({fileId:r.id,fileName:f.name,fileSize:r.sizeBytes});}).catch(function(e){flash(key,'تعذّر رفع الملف ('+code(e)+')','err');});
}
function addFb(u){
  var kind=S.fbKind[u]||'rate',st=has(S.drafts,'fs_'+u)?S.drafts['fs_'+u]:0,text=(dv('ft_'+u,'')||'').trim();
  if(kind==='rate'&&!st){flash('fb_'+u,'اختر عدد النجوم أولاً','err');return;}
  if(text.length<3){flash('fb_'+u,'اكتب تعليقك أولاً','err');return;}
  var o={kind:kind,text:text,createdAt:Date.now()};if(kind==='rate')o.stars=st;
  S.db.collection('feedback/'+u+'/items').add(o).then(function(){delete S.drafts['ft_'+u];delete S.drafts['fs_'+u];flash('fb_'+u,'أُضيفت إلى سجل المتابعة');}).catch(function(e){flash('fb_'+u,'لم تُحفظ ('+code(e)+')','err');});
}
function saveDeadline(){
  var v=dv('deadline',S.settings.deadline||DEFAULT_DEADLINE);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v)){flash('dl','اختر تاريخاً صحيحاً','err');return;}
  S.db.doc('settings/config').set({deadline:v,updatedAt:Date.now()}).then(function(){flash('dl','تم حفظ الموعد');}).catch(function(e){flash('dl','لم يُحفظ ('+code(e)+')','err');});
}
function copySum(){
  var t=buildSummary(),sel=function(){var e=document.getElementById('sumTxt');if(e){e.focus();e.select();}flash('sum','انسخ النص المحدد يدوياً','err');};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){flash('sum','تم النسخ');},sel);else sel();
}

$app.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act;
  if(a==='cancel'){S.confirm=null;render();return;}
  if(a==='login'){if(window.__doLogin)window.__doLogin();return;}
  if(!S.db)return;
  if(a==='pick')pickRole(b.dataset.role);
  else if(a==='saveReport'){clearTimeout(saveTimer);saveReport(false);}
  else if(a==='saveSlot')saveSlot(b.dataset.slot);
  else if(a==='ack')ack(b.dataset.id);
  else if(a==='addFb')addFb(b.dataset.uid);
  else if(a==='fbkind'){S.fbKind[b.dataset.uid]=b.dataset.k;render();}
  else if(a==='fbstar'){S.drafts['fs_'+b.dataset.uid]=+b.dataset.n;render();}
  else if(a==='changeRole'){S.confirm='changeRole';render();}
  else if(a==='changeRoleYes'){S.confirm=null;var m=myMember();if(m)freeRole(S.uid,m.role,'role');}
  else if(a==='free'){S.confirm='free_'+b.dataset.uid;render();}
  else if(a==='freeYes'){S.confirm=null;freeRole(b.dataset.uid,b.dataset.role,'team');}
  else if(a==='saveDeadline')saveDeadline();
  else if(a==='copySum')copySum();
});
$app.addEventListener('input',function(e){
  var t=e.target;if(!t.dataset||!t.dataset.draft)return;
  S.drafts[t.dataset.draft]=t.value;
  if(t.dataset.wc){
    var w=document.getElementById('wc_'+t.dataset.wc);if(w)w.textContent=words(t.value);
    var secs=(S.myReport&&S.myReport.sections)||{},tot=0;SECTIONS.forEach(function(s){if(!s.x)tot+=words(dv('rs_'+s.id,secs[s.id]));});
    var te=document.getElementById('wc_total');if(te)te.textContent=tot;
  }
  if(t.dataset.auto==='r'&&S.db&&S.canWrite!==false)scheduleSave();
});
$app.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.task)toggleTask(t.dataset.task,t.checked);
  else if(t.id==='fileIn'){uploadFor(t.files&&t.files[0],'report',function(x){return saveReport(false,x);});t.value='';}
  else if(t.dataset&&t.dataset.slotfile){var sid=t.dataset.slotfile;uploadFor(t.files&&t.files[0],'dl_'+sid,function(x){return saveSlot(sid,x);});t.value='';}
});
$app.addEventListener('focusout',function(){setTimeout(function(){if(S.pending&&!typing())render();},0);});
window.addEventListener('hashchange',route);

/* ---------- الاتصال بالبيانات ---------- */
function mapSnap(key){return function(s){var m={};s.docs.forEach(function(d){m[d.id]=d.data();});S[key]=m;renderSafe();};}
function watchFb(u){
  if(fbSubs[u])return;
  fbSubs[u]=S.db.collection('feedback/'+u+'/items').orderBy('createdAt','desc').onSnapshot(function(s){S.fb[u]=s.docs.map(function(d){var o=Object.assign({id:d.id},d.data());return o;});renderSafe();},function(){});
}
function subscribe(){
  var db=S.db,slow=setTimeout(function(){if(!S.membersReady){S.dbState='slow';renderSafe();}},10000);
  db.collection('members').onSnapshot(function(s){
    clearTimeout(slow);var m={};s.docs.forEach(function(d){m[d.id]=d.data();});S.members=m;S.membersReady=true;S.dbState='ready';
    if(S.owner)Object.keys(m).forEach(watchFb);
    renderSafe();
  },function(e){clearTimeout(slow);S.dbState='error';S.err=e;render();});
  db.collection('roles').onSnapshot(mapSnap('claims'),function(){});
  db.collection('deliverables').onSnapshot(mapSnap('deliv'),function(){});
  db.doc('settings/config').onSnapshot(function(s){S.settings=s.exists?s.data():{};renderSafe();},function(){});
  db.doc('reports/'+S.uid).onSnapshot(function(s){S.myReport=s.exists?s.data():null;renderSafe();},function(){});
  watchFb(S.uid);
  if(S.owner)db.collection('reports').onSnapshot(mapSnap('reports'),function(){});
}
function makeDb(fs){
  function clean(d){return JSON.parse(JSON.stringify(d));}
  function snapOf(x){return {id:x.id,exists:x.exists,data:function(){return x.data();}};}
  function docRef(r){return {id:r.id,path:r.path,
    get:function(){return r.get().then(snapOf);},
    set:function(d){return r.set(clean(d));},
    update:function(d){return r.set(clean(d),{merge:true});},
    delete:function(){return r.delete();},
    onSnapshot:function(n,e){return r.onSnapshot(function(x){n(snapOf(x));},e||function(){});}};}
  function colRef(q,base){return {
    doc:function(id){return docRef(id?base.doc(id):base.doc());},
    add:function(d){return base.add(clean(d)).then(docRef);},
    orderBy:function(f,dir){return colRef(q.orderBy(f,dir),base);},
    onSnapshot:function(n,e){return q.onSnapshot(function(x){n({docs:x.docs.map(snapOf),size:x.size,empty:x.empty});},e||function(){});}};}
  return {
    doc:function(p){return docRef(fs.doc(p));},
    collection:function(p){var c=fs.collection(p);return colRef(c,c);},
    claim:function(roleId,uid){var ref=fs.doc('roles/'+roleId);
      return fs.runTransaction(function(tx){return tx.get(ref).then(function(x){
        if(x.exists&&x.data().uid&&x.data().uid!==uid)return false;
        tx.set(ref,{uid:uid,at:Date.now()});return true;});});}
  };
}
function startFirebase(){
  var cfg=FIREBASE_CONFIG;
  if(!window.firebase||!cfg||/PASTE/.test(cfg.apiKey||'')||/PUT_LEADER/.test(LEADER_EMAIL)){S.dbState='noconfig';S.ownerKnown=true;route();return;}
  firebase.initializeApp(cfg);
  var auth=firebase.auth(),fs=firebase.firestore();
  window.__doLogin=function(){
    var p=new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(p).catch(function(e){
      if(e&&(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'))auth.signInWithRedirect(p);
      else flash('login','تعذّر تسجيل الدخول ('+code(e)+')','err');});
  };
  auth.onAuthStateChanged(function(u){
    if(!u){S.dbState='signedout';S.ownerKnown=true;route();return;}
    if(S.db)return;
    S.uid=u.uid;S.gname=u.displayName||'';
    S.owner=!!(u.email&&u.emailVerified&&u.email.toLowerCase()===LEADER_EMAIL.toLowerCase());
    S.canWrite=true;S.ownerKnown=true;S.db=makeDb(fs);subscribe();route();
  });
}
route();
startFirebase();
})();
</script>
